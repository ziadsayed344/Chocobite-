<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fdeed6"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Chocobite</title>
<style>
:root{--c:#6b3a17;--c2:#fdecc8;--bg:#fff8ec;--y:#e9a82b;--hd:#fdeed6;--t:#2b1a0e;--g:#8b7d70;--ok:#2e8b57;--bad:#c0392b;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--t);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:var(--c);display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:3px solid var(--y)}
.lg{display:flex;align-items:center;gap:10px}.lg img{height:46px;width:auto;display:block}.lg b{font:700 26px Georgia,'Times New Roman',serif;direction:ltr;letter-spacing:-.5px}.lg b i{font-style:normal;color:var(--y)}
header button{background:#6b3a1718;color:var(--c);border:0;border-radius:12px;font-size:20px;padding:8px 12px}
main{padding:12px}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:#fff;border-top:1px solid #eadccd;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:11px;color:var(--g);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button span{font-size:20px}nav button.on{color:var(--c);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:#fff;border-radius:var(--r);box-shadow:0 1px 4px #8a4b1f1a;padding:10px}
.pc{text-align:center;position:relative;border:0;font-family:inherit;color:inherit;padding:0;overflow:hidden}
.pc .im{height:96px;background:var(--c2);display:flex;align-items:center;justify-content:center;font-size:40px}
.pc img{width:100%;height:96px;object-fit:cover}.pc div.n{padding:6px 6px 0;font-weight:700;font-size:14px}.pc div.pr{padding:0 6px 8px;color:var(--c);font-weight:700}
.q{position:absolute;top:6px;inset-inline-start:6px;background:var(--c);color:#fff;border-radius:99px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13px}
.bar{position:fixed;inset-inline:12px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:4}
.btn{background:var(--c);color:#fff;border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-family:inherit;font-weight:700;width:100%}
.btn.s{background:var(--c2);color:var(--c);width:auto;padding:8px 12px;font-size:14px}.btn.d{background:#fdecea;color:var(--bad)}
input,select{width:100%;padding:12px;border:1px solid #e3d3c3;border-radius:12px;font-size:16px;font-family:inherit;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:var(--g)}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.row>*{margin:0}
.list>.card{margin-bottom:8px}.sub{color:var(--g);font-size:13px}.low{color:var(--bad);font-weight:700}
#m{position:fixed;inset:0;background:#0006;z-index:10;display:none;align-items:flex-end}
#m.on{display:flex}.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 10px}.st{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st .card b{display:block;font-size:20px;color:var(--c)}
.tg{display:flex;gap:8px;margin-bottom:10px}.tg button{flex:1;padding:10px;border-radius:12px;border:1px solid #e3d3c3;background:#fff;font-family:inherit;font-size:15px}.tg .on{background:var(--c);color:#fff}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px;border-radius:10px;border:0;background:var(--c2);color:var(--c);font-size:20px}
/*chips*/.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}.chips button{white-space:nowrap;padding:9px 16px;border-radius:99px;border:1px solid #e3d3c3;background:#fff;font-family:inherit;font-size:15px;color:var(--t)}.chips button.on{background:var(--c);color:#fff;border-color:var(--c)}
#t{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;display:none}
</style></head><body>

<main id="v"></main><nav id="nav"></nav><div id="m" onclick="if(event.target==this)closeM()"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),N=['products','ingredients','expenses','orders'];
const M=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م',Q=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:3});
function today(){return new Date().toLocaleDateString('en-CA')}const dk=t=>new Date(t).toLocaleDateString('en-CA');
let db,S={products:[],ingredients:[],expenses:[],orders:[]},cart={},tab='c',rep={m:'d',d:today()},pimg=null,cat='';
const TABS=[['c','🛒','كاشير'],['o','🧾','الطلبات'],['p','🍫','المنتجات'],['i','📦','المخزون'],['x','💸','مصروفات'],['r','📊','تقارير']];
function open(){return new Promise((r,j)=>{const q=indexedDB.open('chocobite',1);q.onupgradeneeded=()=>N.forEach(s=>q.result.createObjectStore(s,{keyPath:'id'}));q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error)})}
const getAll=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)});
async function load(){for(const s of N)S[s]=await getAll(s)}
function commit(w,d=[]){return new Promise(r=>{const ss=[...new Set([...w,...d].map(x=>x[0]))],t=db.transaction(ss,'readwrite');w.forEach(([s,o])=>t.objectStore(s).put(o));d.forEach(([s,i])=>t.objectStore(s).delete(i));t.oncomplete=async()=>{await load();render();r()};t.onerror=()=>alert('تعذر الحفظ')})}
function toast(x){const t=$('#t');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function modal(h){$('#m').innerHTML='<div class="sheet">'+h+'</div>';$('#m').classList.add('on')}function closeM(){$('#m').classList.remove('on');$('#m').innerHTML=''}
const find=(s,id)=>S[s].find(x=>x.id===id),rcr=e=>(e||[]).reduce((a,r)=>{const g=find('ingredients',r.id);return a+(g?g.cost*r.q:0)},0),rc=p=>rcr(p.recipe),ck=k=>{const[i,j,c]=k.split('~'),p=find('products',i);if(!p)return null;const hj=j!==undefined&&j!=='',o=hj?(p.opts||[])[+j]:null;if(hj&&!o)return null;const ch=c===undefined?null:(p.ch||[])[+c];if(c!==undefined&&ch===undefined)return null;const rec=[...(p.recipe||[]),...(o?o.recipe||[]:[])];return{p,rec,name:p.name+(o?' - '+o.n:'')+(ch?' - '+ch:''),price:+(o?o.price:p.price),cost:+p.cost||rcr(rec)}},qn=p=>Object.entries(cart).filter(([k])=>k.split('~')[0]===p.id).reduce((a,[,q])=>a+q,0);
function fx(lines,sg,mp){lines.forEach(l=>{const p=find('products',l.pid);if(!p)return;const pc=mp.p[p.id]||(mp.p[p.id]={...p});if(pc.stock!==null&&pc.stock!==''&&pc.stock!==undefined)pc.stock=+(pc.stock-sg*l.q).toFixed(3);(l.rec||p.recipe||[]).forEach(r=>{const g=find('ingredients',r.id);if(!g)return;const ic=mp.i[g.id]||(mp.i[g.id]={...g});ic.qty=+(ic.qty-sg*r.q*l.q).toFixed(3)})})}
const fxw=mp=>[...Object.values(mp.p).map(x=>['products',x]),...Object.values(mp.i).map(x=>['ingredients',x])];
function render(){$('#nav').innerHTML=TABS.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('');$('#v').innerHTML=({c:vC,o:vO,p:vP,i:vI,x:vX,r:vR})[tab]();scrollTo(0,0)}
/* كاشير */
function vC(){const tot=Object.entries(cart).reduce((a,[k,q])=>a+q*(ck(k)?.price||0),0),n=Object.keys(cart).length;
 if(!S.products.length)return'<div class="card">لا توجد منتجات بعد. اذهب إلى تبويب المنتجات وأضف أول منتج 🍫</div>';
 const k=p=>(p.cat||'').trim(),cs=[...new Set(S.products.map(k).filter(Boolean))],un=S.products.some(p=>!k(p));if(cat&&cat!=='_'&&!cs.includes(cat)||cat==='_'&&!(cs.length&&un))cat='';
 const L=S.products.filter(p=>!cat||(cat==='_'?!k(p):k(p)===cat)),ch=cs.length?`<div class="chips">${['',...cs,...(un?['_']:[])].map(c=>`<button class="${cat===c?'on':''}" data-c="${E(c)}" onclick="sc(this.dataset.c)">${c===''?'الكل':c==='_'?'أخرى':E(c)}</button>`).join('')}</div>`:'';
 return`<input id="sq" placeholder="🔍 بحث" oninput="fq(this.value)">${ch}<div class="grid" id="pg">${L.map(pc).join('')}</div>`+(n?`<div class="bar"><button class="btn" onclick="cartM()">السلة (${n} صنف) — ${M(tot)}</button></div><div style="height:70px"></div>`:'')}
const pc=p=>{const n=qn(p),o=(p.opts||[]).length;return`<button class="card pc" data-n="${E(p.name)}" onclick="add('${p.id}')">${n?`<span class="q">${Q(n)}</span>`:''}${p.img?`<img src="${p.img}">`:'<div class="im">🧇</div>'}<div class="n">${E(p.name)}</div><div class="pr">${o?'من '+M(Math.min(...p.opts.map(x=>+x.price))):M(p.price)}</div></button>`};
function sc(c){cat=c;render()}
function fq(v){document.querySelectorAll('#pg .pc').forEach(e=>e.style.display=e.dataset.n.includes(v)?'':'none')}
function add(id){const p=find('products',id);if((p.opts||[]).length)return optM(id);if((p.ch||[]).length)return chM(id,'');addk(id)}
function addk(k){cart[k]=(cart[k]||0)+1;const s=$('#sq')?.value;render();if(s){$('#sq').value=s;fq(s)}}
function optM(id){const p=find('products',id);modal(`<h3>${E(p.name)}</h3><div class="list">${p.opts.map((o,i)=>`<button class="card row" style="width:100%;font-family:inherit;font-size:17px;border:0" onclick="pickO('${id}',${i})"><b>${E(o.n)}</b><b style="color:var(--c)">${M(o.price)}</b></button>`).join('')}</div>`)}
function pickO(id,j){const p=find('products',id);if((p.ch||[]).length)return chM(id,j);closeM();addk(id+'~'+j)}
function chM(id,j){const p=find('products',id);modal(`<h3>${E(p.name)}</h3><p class="sub">اختار النوع</p><div class="list">${p.ch.map((c,x)=>`<button class="card row" style="width:100%;font-family:inherit;font-size:18px;border:0" onclick="closeM();addk('${id}~${j}~${x}')"><b>${E(c)}</b></button>`).join('')}</div>`)}
function cartM(){const L=Object.entries(cart).filter(([k])=>ck(k)),sub=L.reduce((a,[k,q])=>a+q*ck(k).price,0);
 modal(`<h3>السلة</h3>`+L.map(([k,q])=>{const c=ck(k);return`<div class="row" style="margin-bottom:10px"><div><b>${E(c.name)}</b><div class="sub">${M(c.price)}</div></div><div class="qty"><button onclick="cq('${k}',-1)">−</button><input type="number" inputmode="numeric" min="0" value="${q}" onchange="cs('${k}',this.value)" style="width:62px;text-align:center;padding:8px;margin:0"><button onclick="cq('${k}',1)">+</button></div></div>`}).join('')+
 `<label>خصم (ج.م)</label><input id="disc" type="number" inputmode="decimal" value="0" oninput="tt(${sub})"><label>طريقة الدفع</label><select id="pay"><option>نقدي</option><option>محفظة/تحويل</option><option>بطاقة</option></select><div class="row" style="margin-bottom:10px"><b>الإجمالي</b><b id="tt" style="font-size:22px;color:var(--c)">${M(sub)}</b></div><button class="btn" onclick="checkout()">✅ إتمام البيع</button>`)}
function tt(s){$('#tt').textContent=M(s-Math.min(+$('#disc').value||0,s))}
function cs(k,v){v=Math.floor(+v);if(v>0)cart[k]=v;else delete cart[k];render();Object.keys(cart).length?cartM():closeM()}
function cq(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];render();Object.keys(cart).length?cartM():closeM()}
async function checkout(){const lines=Object.entries(cart).filter(([k])=>ck(k)).map(([k,q])=>{const c=ck(k);return{pid:c.p.id,name:c.name,price:c.price,cost:c.cost,q,ret:0,rec:c.rec}});if(!lines.length)return;
 const sub=lines.reduce((a,l)=>a+l.price*l.q,0),disc=Math.min(Math.max(+$('#disc').value||0,0),sub),mp={p:{},i:{}};fx(lines,1,mp);
 const o={id:uid(),n:Math.max(0,...S.orders.map(x=>x.n))+1,t:Date.now(),lines,sub,disc,total:sub-disc,pay:$('#pay').value,rets:[]};
 cart={};closeM();await commit([['orders',o],...fxw(mp)]);toast('تم البيع #'+o.n)}
/* الطلبات */
function vO(){const L=[...S.orders].sort((a,b)=>b.t-a.t).slice(0,150);return L.length?`<div class="list">${L.map(o=>`<div class="card row" onclick="showO('${o.id}')"><div><b>#${o.n}</b> ${o.rets.length?'<span class="low">مرتجع</span>':''}<div class="sub">${new Date(o.t).toLocaleString('ar-EG')} · ${E(o.pay)}</div></div><b>${M(o.total)}</b></div>`).join('')}</div>`:'<div class="card">لا توجد طلبات</div>'}
function showO(id){const o=find('orders',id);modal(`<h3>طلب #${o.n}</h3><div class="sub">${new Date(o.t).toLocaleString('ar-EG')}</div><br>`+o.lines.map((l,i)=>`<div class="row" style="margin-bottom:8px"><div>${E(l.name)} × ${l.q}${l.ret?` <span class="low">(مرتجع ${l.ret})</span>`:''}<div class="sub">${M(l.price*l.q)}</div></div>${l.q-l.ret>0?`<button class="btn s" onclick="ret('${o.id}',${i})">↩ مرتجع</button>`:''}</div>`).join('')+`<hr><div class="row"><span>خصم</span><b>${M(o.disc)}</b></div><div class="row"><span>الإجمالي</span><b>${M(o.total)}</b></div>`+(o.rets.length?`<hr><b>المرتجعات</b>`+o.rets.map(r=>`<div class="sub">${E(r.name)} × ${r.q} = ${M(r.amt)} — ${new Date(r.t).toLocaleString('ar-EG')}</div>`).join(''):''))}
async function ret(id,i){const o=JSON.parse(JSON.stringify(find('orders',id))),l=o.lines[i],av=l.q-l.ret,q=+prompt('الكمية المرتجعة (حتى '+av+')',av);if(!(q>0&&q<=av))return;
 l.ret+=q;o.rets.push({t:Date.now(),pid:l.pid,name:l.name,q,amt:+(q*l.price*(o.sub?o.total/o.sub:1)).toFixed(2),cost:l.cost});const mp={p:{},i:{}};fx([{pid:l.pid,q,rec:l.rec}],-1,mp);await commit([['orders',o],...fxw(mp)]);showO(id);toast('تم المرتجع وإرجاع المخزون')}
/* المنتجات */
function vP(){return`<button class="btn" onclick="pform()">➕ منتج جديد</button><br><br><div class="list">${S.products.map(p=>`<div class="card row" onclick="pform('${p.id}')"><div class="row" style="gap:10px">${p.img?`<img src="${p.img}" width="48" height="48" style="border-radius:10px;object-fit:cover">`:'<span style="font-size:30px">🧇</span>'}<div><b>${E(p.name)}</b><div class="sub">${E(p.cat||'')} · تكلفة ${M(+p.cost||rc(p))}${p.stock!==null&&p.stock!==''&&p.stock!==undefined?' · مخزون '+Q(p.stock):''}</div></div></div><b>${(p.opts||[]).length?'من '+M(p.price):M(p.price)}</b></div>`).join('')}</div>`}
function pform(id){const p=id?find('products',id):{};pimg=p.img||null;modal(`<h3>${id?'تعديل':'منتج جديد'}</h3><label>الاسم</label><input id="pn" value="${E(p.name)}"><label>التصنيف</label><input id="pcat" list="cl" value="${E(p.cat)}"><datalist id="cl">${[...new Set(S.products.map(x=>(x.cat||'').trim()).filter(Boolean))].map(c=>`<option value="${E(c)}">`).join('')}</datalist><label>سعر البيع</label><input id="pp" type="number" inputmode="decimal" value="${p.price??''}"><label>التكلفة (اتركها 0 لحسابها من المكونات)</label><input id="pcs" type="number" inputmode="decimal" value="${p.cost??''}"><label>كمية مخزون مباشر (اختياري)</label><input id="ps" type="number" inputmode="decimal" value="${p.stock??''}"><label>الصورة</label><input type="file" accept="image/*" onchange="pickImg(this)"><label>اختيارات إجبارية عند البيع (افصل بينها بفاصلة، مثال: وايت، شوكليت، نص ونص)</label><input id="pch" value="${E((p.ch||[]).join('، '))}"><label>المكونات المخصومة لكل وحدة</label><div id="rr"></div><button class="btn s" onclick="rrow()">+ مكون</button><br><br><label>خيارات بأسعار مختلفة (مثل: شوكولاتة / سكر / عسل)</label><div id="oo"></div><button class="btn s" onclick="orow()">+ خيار</button><br><br><button class="btn" onclick="psave('${id||''}')">حفظ</button>${id?`<br><br><button class="btn d" onclick="pdel('${id}')">🗑 حذف</button>`:''}`);(p.recipe||[]).forEach(r=>rrow(r.id,r.q));(p.opts||[]).forEach(o=>orow(o))}
async function pickImg(i){const f=i.files[0];if(!f)return;pimg=await new Promise(r=>{const m=new Image();m.onload=()=>{const s=Math.min(1,320/Math.max(m.width,m.height)),c=document.createElement('canvas');c.width=m.width*s;c.height=m.height*s;c.getContext('2d').drawImage(m,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};m.src=URL.createObjectURL(f)});toast('تم تحميل الصورة')}
function rrow(id,q){const d=document.createElement('div');d.className='row';d.innerHTML=`<select style="flex:2">${S.ingredients.map(g=>`<option value="${g.id}" ${g.id===id?'selected':''}>${E(g.name)} (${E(g.unit)})</option>`).join('')}</select><input type="number" inputmode="decimal" style="flex:1" placeholder="الكمية" value="${q??''}"><button class="btn s d" onclick="this.parentNode.remove()">✕</button>`;$('#rr').appendChild(d)}
function orow(o){o=o||{};const r=(o.recipe||[])[0]||{},d=document.createElement('div');d.className='card';d.style.marginBottom='8px';d.innerHTML=`<div class="row"><input placeholder="الاسم (مثلاً شوكولاتة)" value="${E(o.n)}" style="flex:2"><input type="number" inputmode="decimal" placeholder="السعر" value="${o.price??''}" style="flex:1"></div><div class="row"><select style="flex:2"><option value="">بدون مكون إضافي</option>${S.ingredients.map(g=>`<option value="${g.id}" ${g.id===r.id?'selected':''}>${E(g.name)} (${E(g.unit)})</option>`).join('')}</select><input type="number" inputmode="decimal" placeholder="الكمية" value="${r.q??''}" style="flex:1"><button class="btn s d" onclick="this.closest('.card').remove()">✕</button></div>`;$('#oo').appendChild(d)}
async function psave(id){const n=$('#pn').value.trim(),opts=[...document.querySelectorAll('#oo .card')].map(d=>{const i=d.querySelectorAll('input'),s=d.querySelector('select'),q=+i[2].value;return{n:i[0].value.trim(),price:+i[1].value,pv:i[1].value,recipe:s.value&&q>0?[{id:s.value,q}]:[]}}).filter(o=>o.n&&o.pv!=='').map(({pv,...o})=>o);
 if(!n||(!opts.length&&$('#pp').value==='')){alert('أدخل الاسم والسعر (أو خيارات بأسعارها)');return}
 const pr=$('#pp').value===''?Math.min(...opts.map(o=>o.price)):+$('#pp').value,recipe=[...document.querySelectorAll('#rr .row')].map(d=>({id:d.querySelector('select').value,q:+d.querySelector('input').value})).filter(r=>r.id&&r.q>0),sv=$('#ps').value;
 await commit([['products',{...(id?find('products',id):{}),id:id||uid(),name:n,cat:$('#pcat').value.trim(),price:pr,cost:+$('#pcs').value||0,stock:sv===''?null:+sv,img:pimg,recipe,opts,ch:$('#pch').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean)}]]);closeM()}
async function pdel(id){if(confirm('حذف المنتج؟ (الطلبات القديمة تبقى كما هي)')){Object.keys(cart).forEach(k=>k.split('~')[0]===id&&delete cart[k]);await commit([],[['products',id]]);closeM()}}
/* المخزون */
function vI(){return`<button class="btn" onclick="iform()">➕ مكون جديد</button><br><br><div class="list">${S.ingredients.map(g=>`<div class="card"><div class="row"><div><b>${E(g.name)}</b><div class="sub">${M(g.cost)} لكل ${E(g.unit)}</div></div><b class="${g.qty<=g.min?'low':''}">${Q(g.qty)} ${E(g.unit)}</b></div><div class="row" style="margin-top:8px"><button class="btn s" onclick="buy('${g.id}')">🛍 شراء</button><button class="btn s" onclick="iform('${g.id}')">✏️ تعديل</button></div>${g.qty<=g.min?'<div class="low sub">⚠ وصل للحد الأدنى</div>':''}</div>`).join('')||'<div class="card">لا توجد مكونات. أضف مكونات (دقيق، شوكولاتة...) وحدد كميتها.</div>'}</div>`}
function iform(id){const g=id?find('ingredients',id):{};modal(`<h3>${id?'تعديل':'مكون جديد'}</h3><label>الاسم</label><input id="in" value="${E(g.name)}"><label>الوحدة (جم / مل / قطعة)</label><input id="iu" value="${E(g.unit||'جم')}"><label>الكمية الحالية</label><input id="iq" type="number" inputmode="decimal" value="${g.qty??0}"><label>حد التنبيه</label><input id="im" type="number" inputmode="decimal" value="${g.min??0}"><label>تكلفة الوحدة</label><input id="ic" type="number" inputmode="decimal" value="${g.cost??0}"><button class="btn" onclick="isave('${id||''}')">حفظ</button>${id?`<br><br><button class="btn d" onclick="idel('${id}')">🗑 حذف</button>`:''}`)}
async function isave(id){const n=$('#in').value.trim();if(!n){alert('أدخل الاسم');return}await commit([['ingredients',{id:id||uid(),name:n,unit:$('#iu').value.trim()||'جم',qty:+$('#iq').value||0,min:+$('#im').value||0,cost:+$('#ic').value||0}]]);closeM()}
async function idel(id){if(confirm('حذف المكون؟')){await commit([],[['ingredients',id]]);closeM()}}
function buy(id){const g=find('ingredients',id);modal(`<h3>شراء ${E(g.name)}</h3><label>الكمية المشتراة (${E(g.unit)})</label><input id="bq" type="number" inputmode="decimal"><label>إجمالي السعر المدفوع</label><input id="bp" type="number" inputmode="decimal"><button class="btn" onclick="bsave('${id}')">تسجيل الشراء</button>`)}
async function bsave(id){const g={...find('ingredients',id)},q=+$('#bq').value,p=+$('#bp').value;if(!(q>0)||!(p>=0)){alert('أدخل الكمية والسعر');return}
 g.cost=+(p/q).toFixed(4);g.qty=+(g.qty+q).toFixed(3);await commit([['ingredients',g],['expenses',{id:uid(),t:Date.now(),title:'شراء '+g.name,amount:p,kind:'buy'}]]);closeM();toast('تم الشراء')}
/* مصروفات */
function cashBox(){const key=rep.m=='d'?rep.d:rep.d.slice(0,7),inR=t=>dk(t).startsWith(key);let s=0,rt=0,sc=0,rcs=0;
 S.orders.forEach(o=>{const cash=o.pay=='نقدي';if(inR(o.t)){s+=o.total;if(cash)sc+=o.total}o.rets.forEach(x=>{if(inR(x.t)){rt+=x.amt;if(cash)rcs+=x.amt}})});
 const ex=S.expenses.filter(e=>e.kind=='exp'&&inR(e.t)).reduce((a,e)=>a+e.amount,0),by=S.expenses.filter(e=>e.kind=='buy'&&inR(e.t)).reduce((a,e)=>a+e.amount,0),net=s-rt-ex-by,cn=sc-rcs-ex-by,cl=v=>v>=0?'var(--ok)':'var(--bad)';
 return`<div class="tg"><button class="${rep.m=='d'?'on':''}" onclick="rep.m='d';render()">يومي</button><button class="${rep.m=='m'?'on':''}" onclick="rep.m='m';render()">شهري</button></div><input type="${rep.m=='d'?'date':'month'}" value="${rep.m=='d'?rep.d:rep.d.slice(0,7)}" onchange="rep.d=this.value.length==7?this.value+'-01':this.value;render()">
 <div class="card" style="margin-bottom:12px"><div class="row"><span>المبيعات</span><b>${M(s)}</b></div><div class="row"><span>المرتجعات</span><b>− ${M(rt)}</b></div><div class="row"><span>المصروفات</span><b>− ${M(ex)}</b></div><div class="row"><span>مشتريات المخزون</span><b>− ${M(by)}</b></div><hr><div class="row"><b>الصافي في جيبك</b><b style="font-size:24px;color:${cl(net)}">${M(net)}</b></div>${sc!==s?`<div class="row" style="margin-top:6px"><span class="sub">منه نقدي فقط (الكاش اللي معاك)</span><b style="color:${cl(cn)}">${M(cn)}</b></div>`:''}</div>`}
function vX(){const L=[...S.expenses].sort((a,b)=>b.t-a.t).slice(0,150);return`${cashBox()}<button class="btn" onclick="xform()">➕ تسجيل مصروف</button><br><br><div class="list">${L.map(e=>`<div class="card row"><div><b>${E(e.title)}</b><div class="sub">${e.kind=='buy'?'مشتريات':'مصروف'} · ${new Date(e.t).toLocaleDateString('ar-EG')}</div></div><div class="row"><b>${M(e.amount)}</b><button class="btn s d" onclick="xdel('${e.id}')">✕</button></div></div>`).join('')}</div>`}
function xform(){modal(`<h3>مصروف جديد</h3><label>البيان</label><input id="xt"><label>المبلغ</label><input id="xa" type="number" inputmode="decimal"><label>النوع</label><select id="xk"><option value="exp">مصروف (إيجار، كهرباء، رواتب...)</option><option value="buy">مشتريات</option></select><button class="btn" onclick="xsave()">حفظ</button>`)}
async function xsave(){const a=+$('#xa').value,t=$('#xt').value.trim();if(!t||!(a>0)){alert('أدخل البيان والمبلغ');return}await commit([['expenses',{id:uid(),t:Date.now(),title:t,amount:a,kind:$('#xk').value}]]);closeM()}
async function xdel(id){if(confirm('حذف؟'))await commit([],[['expenses',id]])}
/* تقارير */
function vR(){const key=rep.m=='d'?rep.d:rep.d.slice(0,7),inR=t=>dk(t).startsWith(key);let sales=0,cogs=0,cnt=0,ret=0;const top={};
 S.orders.forEach(o=>{if(inR(o.t)){cnt++;sales+=o.total;o.lines.forEach(l=>{cogs+=l.cost*l.q;top[l.name]=(top[l.name]||0)+l.q})}o.rets.forEach(r=>{if(inR(r.t)){ret+=r.amt;cogs-=r.cost*r.q}})});
 const ex=S.expenses.filter(e=>e.kind=='exp'&&inR(e.t)).reduce((a,e)=>a+e.amount,0),by=S.expenses.filter(e=>e.kind=='buy'&&inR(e.t)).reduce((a,e)=>a+e.amount,0),net=sales-ret,gp=net-cogs,tp=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return`<div class="tg"><button class="${rep.m=='d'?'on':''}" onclick="rep.m='d';render()">يومي</button><button class="${rep.m=='m'?'on':''}" onclick="rep.m='m';render()">شهري</button></div><input type="${rep.m=='d'?'date':'month'}" value="${rep.m=='d'?rep.d:rep.d.slice(0,7)}" onchange="rep.d=this.value.length==7?this.value+'-01':this.value;render()">
 <div class="st"><div class="card">صافي المبيعات<b>${M(net)}</b></div><div class="card">عدد الطلبات<b>${Q(cnt)}</b></div><div class="card">تكلفة المبيعات<b>${M(cogs)}</b></div><div class="card">الربح الإجمالي<b>${M(gp)}</b></div><div class="card">المصروفات<b>${M(ex)}</b></div><div class="card">صافي الربح<b style="color:${gp-ex>=0?'var(--ok)':'var(--bad)'}">${M(gp-ex)}</b></div><div class="card">المرتجعات<b>${M(ret)}</b></div><div class="card">مشتريات المخزون<b>${M(by)}</b></div></div>
 <br><div class="card"><b>الأكثر مبيعاً</b>${tp.map(t=>`<div class="row sub"><span>${E(t[0])}</span><span>${Q(t[1])}</span></div>`).join('')||'<div class="sub">لا بيانات</div>'}</div><p class="sub">ملاحظة: الربح = المبيعات − التكلفة − المصروفات. مشتريات المخزون لا تُخصم مرتين لأن التكلفة محسوبة عند البيع.</p>`}
/* إعدادات ونسخ احتياطي */
async function settings(){const p=await navigator.storage?.persisted?.();modal(`<h3>⚙️ النسخ الاحتياطي</h3><button class="btn" onclick="bk()">⬇️ تصدير نسخة احتياطية</button><br><br><label>استرجاع من ملف</label><input type="file" accept=".json" onchange="rs(this)"><div class="sub">التخزين الدائم: ${p?'مفعّل ✅':'غير مؤكد — خذ نسخة احتياطية بانتظام'}</div><br><label>استيراد أصناف المنيو من ملف (JSON)</label><input type="file" accept=".json" onchange="im(this)"><br><label>تعديل أسعار الأقسام بمبلغ ثابت</label>${[...new Set(S.products.map(x=>(x.cat||'').trim()).filter(Boolean))].map(c=>`<label style="display:flex;gap:10px;align-items:center;font-size:16px;color:var(--t);margin:4px 0"><input type="checkbox" class="bc" value="${E(c)}" style="width:auto;margin:0"> ${E(c)}</label>`).join('')}<input id="ba" type="number" inputmode="decimal" placeholder="المبلغ (مثلاً 5 للزيادة أو -5 للخفض)"><button class="btn" onclick="bulk()">تطبيق على الأقسام المحددة</button><br><br><button class="btn d" onclick="wipe()">🗑 مسح كل البيانات</button>`)}
function bk(){const b=new Blob([JSON.stringify({app:'chocobite',v:1,t:Date.now(),data:S})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chocobite-backup-'+today()+'.json';a.click()}
async function rs(i){const f=i.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(j.app!='chocobite'||!N.every(n=>Array.isArray(j.data[n])))throw 0;if(!confirm('سيتم استبدال كل البيانات الحالية. متابعة؟'))return;await new Promise(r=>{const t=db.transaction(N,'readwrite');N.forEach(n=>{t.objectStore(n).clear();j.data[n].forEach(o=>t.objectStore(n).put(o))});t.oncomplete=r});await load();cart={};closeM();render();toast('تم الاسترجاع')}catch(e){alert('ملف غير صالح')}}
async function im(i){const f=i.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(!Array.isArray(j))j=j.products;if(!Array.isArray(j))throw 0;const ex=new Set(S.products.map(p=>p.name.trim())),ad=j.filter(x=>x&&x.name&&x.price!==undefined&&!ex.has(String(x.name).trim())).map(x=>({id:uid(),name:String(x.name).trim(),cat:String(x.cat||'').trim(),price:+x.price||0,cost:+x.cost||0,stock:null,img:null,recipe:[],opts:(x.opts||[]).map(o=>({n:String(o.n),price:+o.price||0,recipe:[]})),ch:(x.ch||[]).map(String)}));if(!ad.length){alert('كل الأصناف موجودة بالفعل');return}if(!confirm('سيتم إضافة '+ad.length+' صنف جديد (الأصناف الموجودة بنفس الاسم لا تتكرر). متابعة؟'))return;await commit(ad.map(p=>['products',p]));closeM();toast('تمت إضافة '+ad.length+' صنف')}catch(e){alert('ملف غير صالح')}}
async function bulk(){const cs=[...document.querySelectorAll('.bc:checked')].map(x=>x.value),a=+$('#ba').value;if(!cs.length||!a){alert('حدد قسماً واحداً على الأقل واكتب المبلغ');return}
 const L=S.products.filter(p=>cs.includes((p.cat||'').trim()));if(!L.length)return;const f=n=>Math.max(0,+(+n+a).toFixed(2));
 if(!confirm('سيتم تغيير أسعار '+L.length+' صنف بمقدار '+a+' ج.م (المبيعات القديمة لا تتأثر). متابعة؟'))return;
 await commit(L.map(p=>['products',{...p,price:f(p.price),opts:(p.opts||[]).map(o=>({...o,price:f(o.price)}))}]));closeM();toast('تم تعديل أسعار '+L.length+' صنف')}
async function wipe(){if(confirm('مسح كل شيء نهائياً؟')&&confirm('تأكيد أخير: خذ نسخة احتياطية أولاً. مسح؟')){await new Promise(r=>{const t=db.transaction(N,'readwrite');N.forEach(n=>t.objectStore(n).clear());t.oncomplete=r});await load();cart={};closeM();render()}}
(async()=>{await open();await load();navigator.storage?.persist?.();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
